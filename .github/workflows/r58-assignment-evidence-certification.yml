name: R58 Assignment-Grounded Research Evidence Certification

on:
  workflow_dispatch:
  push:
    branches:
      - research/r58-assignment-grounded-evidence-selection

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      R57_ARTIFACT_EXTRACT_ROOT: /tmp/r58-r57-artifact
      R57_RELEASE_ROOT: /tmp/r58-r57-artifact/nexus-capability-actions-20261025-r57
      R58_TEST_ROOT: /tmp/nexus-capability-actions-20261025-r58-test
      NEXUS_REPO_ROOT: /tmp/nexus-capability-actions-20261025-r58-test
      NEXUS_RESEARCH_STATE_ROOT: /tmp/r58-test-state
      R57_TEST_ROOT: /tmp/r58-r57-artifact/nexus-capability-actions-20261025-r57
      R57_PREDECESSOR_SHA256: 69d9fa36271b346337d47ce01c349df69eed1631b312d3502d7ae27b1dc805e3

    steps:
      - name: Checkout exact R58 source lineage
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded certification dependencies
        run: |
          python -m pip install pytest 'mcp<2' pydantic-settings uvicorn
          sudo apt-get update
          sudo apt-get install -y postgresql-client zsh
      - name: Fetch and verify exact certified R57 artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ops/fetch_certified_r57_artifact.py
      - name: Compose R58 test runtime from R57 artifact and declared overlay
        run: python scripts/ops/prepare_r58_certification_runtime.py
      - name: Install isolated R57 governor fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 -f "$R58_TEST_ROOT/certification/r57_source/sql/isolated_governor_schema.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$R58_TEST_ROOT/supabase/migrations/20261025150000_nexus_governor_reservation_ordering_fix.sql"
      - name: Run inherited R57 safety, governor, and R58 evidence tests
        env:
          PYTHONPATH: /tmp/nexus-capability-actions-20261025-r58-test:/tmp/nexus-capability-actions-20261025-r58-test/scripts
          R58_CERT_REPORT: ${{ github.workspace }}/dist/r58_certification.xml
        run: |
          mkdir -p dist
          cd "$RUNNER_TEMP"
          python -m pytest -q --import-mode=importlib \
            "$R58_TEST_ROOT/scripts/nexus_agent_platform/tests/test_research_only_contract.py" \
            "$R58_TEST_ROOT/services/nexus_mcp/tests/test_research_assignment_intent.py" \
            "$R58_TEST_ROOT/scripts/nexus_agent_platform/tests/test_research_parent_workflow.py" \
            "$R58_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r53_host_gate_cleanup.py" \
            "$R58_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r52_research_worker_safety.py" \
            "$R58_TEST_ROOT/scripts/research/tests/test_research_state_v2_persistence.py" \
            "$R58_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r56_release_readiness_manifest.py" \
            "$R58_TEST_ROOT/certification/r57_source/tests/test_r57_governor_reservation_ordering.py" \
            "$GITHUB_WORKSPACE/certification/r58_source/tests/test_r58_assignment_evidence.py" \
            -k 'not test_r56_worker_import_roots_are_the_current_release and not test_packaged_r56_root_is_discovered_without_environment_override' \
            --junitxml="$R58_CERT_REPORT"
      - name: Build immutable R58 from the exact R57 artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
          R58_CERT_REPORT: ${{ github.workspace }}/dist/r58_certification.xml
        run: python scripts/ops/build_r58_release.py
      - name: Offline launch, import-root, readiness, and golden selector smoke test
        run: python certification/r58_source/tests/r58_release_smoke.py
      - name: Verify R58 archive, R57 ancestry, and exact source lineage
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/ops/verify_r58_source_lineage.py
      - name: Upload immutable R58 artifact and certification report
        uses: actions/upload-artifact@v4
        with:
          name: nexus-capability-actions-20261025-r58
          path: |
            dist/nexus-capability-actions-20261025-r58.tar.gz
            dist/nexus-capability-actions-20261025-r58.sha256
            dist/r58_certification.xml
          if-no-files-found: error
          retention-days: 30
