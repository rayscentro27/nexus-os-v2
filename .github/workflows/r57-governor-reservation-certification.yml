name: R57 Governor Reservation Ordering Certification

on:
  workflow_dispatch:
  push:
    branches:
      - research/r57-governor-reservation-ordering

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      R56_ARTIFACT_EXTRACT_ROOT: /tmp/r57-r56-artifact
      R56_RELEASE_ROOT: /tmp/r57-r56-artifact/nexus-capability-actions-20261025-r56
      R57_PREDECESSOR_SHA256: 69d9fa36271b346337d47ce01c349df69eed1631b312d3502d7ae27b1dc805e3
    steps:
      - name: Checkout exact R57 source lineage
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and runtime dependencies
        run: |
          python -m pip install pytest 'mcp<2' pydantic-settings uvicorn
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Fetch and verify exact certified R56 artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ops/fetch_certified_r56_artifact.py
      - name: Stage inherited R56 compatibility suites
        run: python scripts/ops/prepare_r57_certification_runtime.py
      - name: Install isolated governor fixture and additive migration
        run: |
          psql -X -v ON_ERROR_STOP=1 -f certification/r57_source/sql/isolated_governor_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261025150000_nexus_governor_reservation_ordering_fix.sql
      - name: Run inherited R56 safety suite and R57 PostgreSQL ordering matrix
        env:
          R55_TEST_ROOT: /tmp/r57-r56-artifact/nexus-capability-actions-20261025-r56
          R56_TEST_ROOT: /tmp/r57-r56-artifact/nexus-capability-actions-20261025-r56
          PYTHONPATH: /tmp/r57-r56-artifact/nexus-capability-actions-20261025-r56:/tmp/r57-r56-artifact/nexus-capability-actions-20261025-r56/scripts
          NEXUS_REPO_ROOT: /tmp/r57-r56-artifact/nexus-capability-actions-20261025-r56
          NEXUS_RESEARCH_STATE_ROOT: /tmp/r57-test-state
          R57_CERT_REPORT: ${{ github.workspace }}/dist/r57_certification.xml
        run: |
          mkdir -p dist
          cd "$RUNNER_TEMP"
          python -m pytest -q --import-mode=importlib \
            "$R56_TEST_ROOT/scripts/nexus_agent_platform/tests/test_research_only_contract.py" \
            "$R56_TEST_ROOT/services/nexus_mcp/tests/test_research_assignment_intent.py" \
            "$R56_TEST_ROOT/scripts/nexus_agent_platform/tests/test_research_parent_workflow.py" \
            "$R56_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r53_host_gate_cleanup.py" \
            "$R56_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r52_research_worker_safety.py" \
            "$R56_TEST_ROOT/scripts/research/tests/test_research_state_v2_persistence.py" \
            "$R56_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r55_deployable_release.py" \
            "$R56_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r56_release_readiness_manifest.py" \
            "$GITHUB_WORKSPACE/certification/r57_source/tests/test_r57_governor_reservation_ordering.py" \
            --junitxml="$R57_CERT_REPORT"
      - name: Build immutable R57 from exact R56 artifact and passing report
        env:
          GITHUB_SHA: ${{ github.sha }}
          R57_CERT_REPORT: ${{ github.workspace }}/dist/r57_certification.xml
        run: python scripts/ops/build_r57_release.py
      - name: Verify R57 archive manifest, payload and source lineage
        run: python scripts/ops/verify_r57_source_lineage.py
      - name: Upload R57 artifact and certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexus-capability-actions-20261025-r57
          path: |
            dist/nexus-capability-actions-20261025-r57.tar.gz
            dist/nexus-capability-actions-20261025-r57.sha256
            dist/r57_certification.xml
          if-no-files-found: error
          retention-days: 30
