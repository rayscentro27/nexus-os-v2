name: R60 Selector Metadata Fix Certification

on:
  workflow_dispatch:
  push:
    branches:
      - research/r60-selector-metadata-fix

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PYTHONDONTWRITEBYTECODE: "1"
      R59_ARTIFACT_EXTRACT_ROOT: /tmp/r60-r59-artifact
      R59_RELEASE_ROOT: /tmp/r60-r59-artifact/nexus-capability-actions-20261025-r59
      R60_TEST_ROOT: /tmp/nexus-capability-actions-20261025-r60-test
      R58_TEST_ROOT: /tmp/nexus-capability-actions-20261025-r60-test
      R57_TEST_ROOT: /tmp/nexus-capability-actions-20261025-r60-test
      R56_TEST_ROOT: /tmp/nexus-capability-actions-20261025-r60-test
      R57_PREDECESSOR_SHA256: 69d9fa36271b346337d47ce01c349df69eed1631b312d3502d7ae27b1dc805e3
      NEXUS_REPO_ROOT: /tmp/nexus-capability-actions-20261025-r60-test
      NEXUS_RESEARCH_STATE_ROOT: /tmp/r60-test-state
    steps:
      - name: Checkout R60 source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded certification dependencies
        run: |
          python -m pip install pytest 'mcp<2' pydantic-settings uvicorn
          sudo apt-get update
          sudo apt-get install -y postgresql-client zsh
      - name: Fetch and verify exact certified R59 artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ops/fetch_certified_r59_artifact.py
      - name: Stage exact R59 base with one R60 runtime overlay
        run: python scripts/ops/prepare_r60_certification_runtime.py
      - name: Install isolated R57 governor fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 -f "$R60_TEST_ROOT/certification/r57_source/sql/isolated_governor_schema.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$R60_TEST_ROOT/supabase/migrations/20261025150000_nexus_governor_reservation_ordering_fix.sql"
      - name: Run inherited R57-R59 and focused R60 contract suites
        env:
          PYTHONPATH: /tmp/nexus-capability-actions-20261025-r60-test:/tmp/nexus-capability-actions-20261025-r60-test/scripts
          R60_CERT_REPORT: ${{ github.workspace }}/dist/r60_certification.xml
        run: |
          mkdir -p dist
          cd "$RUNNER_TEMP"
          python -m pytest -q --import-mode=importlib \
            "$R60_TEST_ROOT/scripts/nexus_agent_platform/tests/test_research_only_contract.py" \
            "$R60_TEST_ROOT/services/nexus_mcp/tests/test_research_assignment_intent.py" \
            "$R60_TEST_ROOT/scripts/nexus_agent_platform/tests/test_research_parent_workflow.py" \
            "$R60_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r53_host_gate_cleanup.py" \
            "$R60_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r52_research_worker_safety.py" \
            "$R60_TEST_ROOT/scripts/research/tests/test_research_state_v2_persistence.py" \
            "$R60_TEST_ROOT/scripts/nexus_agent_platform/tests/test_r56_release_readiness_manifest.py" \
            "$R60_TEST_ROOT/certification/r57_source/tests/test_r57_governor_reservation_ordering.py" \
            "$R60_TEST_ROOT/certification/r58_source/tests/test_r58_assignment_evidence.py" \
            "$R60_TEST_ROOT/certification/r59_source/tests/test_r59_timestamp_cleanup.py" \
            "$GITHUB_WORKSPACE/certification/r60_source/tests/test_r60_metadata_anchor.py" \
            -k 'not test_r56_worker_import_roots_are_the_current_release and not test_packaged_r56_root_is_discovered_without_environment_override' \
            --junitxml="$R60_CERT_REPORT"
      - name: Build immutable R60 from exact R59 base
        env:
          GITHUB_SHA: ${{ github.sha }}
          R60_CERT_REPORT: ${{ github.workspace }}/dist/r60_certification.xml
        run: python scripts/ops/build_r60_release.py
      - name: Offline launch, import-root, readiness, and selector smoke
        run: python certification/r60_source/tests/r60_release_smoke.py
      - name: Verify exact R59 ancestry and R60 artifact/source lineage
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/ops/verify_r60_source_lineage.py
      - name: Upload immutable R60 artifact and certification report
        uses: actions/upload-artifact@v4
        with:
          name: nexus-capability-actions-20261025-r60
          path: |
            dist/nexus-capability-actions-20261025-r60.tar.gz
            dist/nexus-capability-actions-20261025-r60.sha256
            dist/r60_certification.xml
          if-no-files-found: error
          retention-days: 30
