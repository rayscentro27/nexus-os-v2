# Netlify build settings for Nexus OS v2.
# Production deploys intentionally use the proven Vite artifact build while the
# local Tailwind/typecheck stall is tracked separately for Systems remediation.
# GitHub main → Netlify production deploy is enabled at the site level only.

[build]
  command = "vite build"
  publish = "dist"
  functions = "netlify/functions"

# Explicit static rewrites must precede the SPA fallback. These rules preserve
# all three supported Got Funding paths without affecting hash-based Nexus UI routes.
[[redirects]]
  from = "/got-funding"
  to = "/got-funding/index.html"
  status = 200

[[redirects]]
  from = "/got-funding/"
  to = "/got-funding/index.html"
  status = 200

[[redirects]]
  from = "/api/alpha/search"
  to = "/.netlify/functions/alpha-search"
  status = 200

[[redirects]]
  from = "/api/alpha/url-review"
  to = "/.netlify/functions/alpha-url-review"
  status = 200

[[redirects]]
  from = "/api/alpha/*"
  to = "/.netlify/functions/alpha-provider/:splat"
  status = 200

[[redirects]]
  from = "/api/tiktok/auth/start"
  to = "/.netlify/functions/tiktok-auth-start"
  status = 200

[[redirects]]
  from = "/api/tiktok/oauth/callback"
  to = "/.netlify/functions/tiktok-oauth-callback"
  status = 200

[[redirects]]
  from = "/api/tiktok/creator-info"
  to = "/.netlify/functions/tiktok-creator-info"
  status = 200

[[redirects]]
  from = "/api/tiktok/post-status"
  to = "/.netlify/functions/tiktok-post-status"
  status = 200

[[redirects]]
  from = "/api/tiktok/post-init"
  to = "/.netlify/functions/tiktok-post-init"
  status = 200

[[redirects]]
  from = "/api/tiktok/connection-status"
  to = "/.netlify/functions/tiktok-connection-status"
  status = 200

[[redirects]]
  from = "/api/tiktok/token-refresh"
  to = "/.netlify/functions/tiktok-token-refresh"
  status = 200

[[redirects]]
  from = "/api/tiktok/disconnect"
  to = "/.netlify/functions/tiktok-disconnect"
  status = 200

# SPA fallback so the React app's client routes resolve. The static landing page
# (public/goclear-apex-readiness.html → dist/goclear-apex-readiness.html) is a real file and is
# served directly; this redirect only catches unknown app routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
