[[redirects]]
  from = "/api/tiktok/post-init"
  to = "/.netlify/functions/tiktok-post-init"
  status = 200

[[redirects]]
  from = "/api/tiktok/connection-status"
  to = "/.netlify/functions/tiktok-connection-status"
  status = 200

[[redirects]]
  from = "/api/tiktok/token-refresh"
  to = "/.netlify/functions/tiktok-token-refresh"
  status = 200

[[redirects]]
  from = "/api/tiktok/disconnect"
  to = "/.netlify/functions/tiktok-disconnect"
  status = 200

# SPA fallback so the React app's client routes resolve. The static landing page
# (public/goclear-apex-readiness.html → dist/goclear-apex-readiness.html) is a real file and is
# served directly; this redirect only catches unknown app routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/postiz-auth/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-Hb7XuGfmFJ2/0bp1gmrwgyX5KE0u/UtpB7lN3SQSUOc=' 'sha256-rRIk00MPT6S8TSa0DOPX2mhj5FZ41++yemReNa9RRRY=' 'sha256-1rEYNZI0b5tvCPCWxbyymqcaB0mYPmL4vLM8MiUmNE0='; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/integrations/social/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-Hb7XuGfmFJ2/0bp1gmrwgyX5KE0u/UtpB7lN3SQSUOc=' 'sha256-rRIk00MPT6S8TSa0DOPX2mhj5FZ41++yemReNa9RRRY=' 'sha256-1rEYNZI0b5tvCPCWxbyymqcaB0mYPmL4vLM8MiUmNE0='; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
