# Netlify build settings for Nexus OS v2.
# Production deploys intentionally use the proven Vite artifact build while the
# local Tailwind/typecheck stall is tracked separately for Systems remediation.
# GitHub main → Netlify production deploy is enabled at the site level only.

[build]
  command = "node scripts/deployment/cloud_build.mjs"
  publish = "dist"
  functions = "netlify/functions"

# Explicit static rewrites must precede the SPA fallback. These rules preserve
# all three supported Got Funding paths without affecting hash-based Nexus UI routes.
# postiz-auth.goclearonline.cc: Meta OAuth bounce pages only (to the private tailnet Postiz). All else 404.
[[redirects]]
  from = "https://postiz-auth.goclearonline.cc/integrations/social/facebook"
  to = "/postiz-auth/facebook/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://postiz-auth.goclearonline.cc/integrations/social/instagram"
  to = "/postiz-auth/instagram/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://postiz-auth.goclearonline.cc/integrations/social/tiktok"
  to = "/postiz-auth/tiktok/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://postiz-auth.goclearonline.cc/*"
  to = "/postiz-auth/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/integrations/social/*"
  to = "/postiz-auth/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/got-funding"
  to = "/got-funding/index.html"
  status = 200

[[redirects]]
  from = "/got-funding/"
  to = "/got-funding/index.html"
  status = 200

[[redirects]]
  from = "/terms/nexus-social-publisher"
  to = "/terms/nexus-social-publisher/index.html"
  status = 200

[[redirects]]
  from = "/terms/nexus-social-publisher/"
  to = "/terms/nexus-social-publisher/index.html"
  status = 200

[[redirects]]
  from = "/privacy/nexus-social-publisher"
  to = "/privacy/nexus-social-publisher/index.html"
  status = 200

[[redirects]]
  from = "/privacy/nexus-social-publisher/"
  to = "/privacy/nexus-social-publisher/index.html"
  status = 200

[[redirects]]
  from = "/privacy/nexus-postiz"
  to = "/privacy/nexus-postiz/index.html"
  status = 200

[[redirects]]
  from = "/privacy/nexus-postiz/"
  to = "/privacy/nexus-postiz/index.html"
  status = 200

[[redirects]]
  from = "/privacy/nexus-postiz/data-deletion"
  to = "/privacy/nexus-postiz/data-deletion/index.html"
  status = 200

[[redirects]]
  from = "/privacy/nexus-postiz/data-deletion/"
  to = "/privacy/nexus-postiz/data-deletion/index.html"
  status = 200

[[redirects]]
  from = "/api/alpha/search"
  to = "/.netlify/functions/alpha-search"
  status = 200

[[redirects]]
  from = "/api/alpha/url-review"
  to = "/.netlify/functions/alpha-url-review"
  status = 200

[[redirects]]
  from = "/api/alpha/*"
  to = "/.netlify/functions/alpha-provider/:splat"
  status = 200

[[redirects]]
  from = "/api/tiktok/auth/start"
  to = "/.netlify/functions/tiktok-auth-start"
  status = 200

[[redirects]]
  from = "/api/tiktok/oauth/callback"
  to = "/.netlify/functions/tiktok-oauth-callback"
  status = 200

[[redirects]]
  from = "/api/tiktok/creator-info"
  to = "/.netlify/functions/tiktok-creator-info"
